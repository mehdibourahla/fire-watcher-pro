name: Translation apply gate

# Accepting a suggestion only sets a status; the file change is a separate manual
# script. Without this, an accepted fix can sit unshipped indefinitely.
on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch: {}

permissions: {}

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      - name: Fail if an accepted suggestion never reached its locale file
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          for locale in ar fr kab; do
            bun run apply:translations "$locale" --check
          done

name: Cold archive

# Each run exports every pending day, so a schedule GitHub drops only delays the export.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      trial_table:
        description: Trial one day of this table under trial/, deleting nothing (empty runs the archive)
        required: false
        type: string
      trial_day:
        description: Trial day, yyyy-mm-dd
        required: false
        type: string

permissions: {}

concurrency:
  group: cold-archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      - name: Install DuckDB 1.5.5
        run: |
          curl -sSLo duckdb.gz https://github.com/duckdb/duckdb/releases/download/v1.5.5/duckdb_cli-linux-amd64.gz
          echo "c61f21485e6e41d3a0c28ce9904ea18346309cf427b4cf9479bc3564348dc885  duckdb.gz" | sha256sum -c
          gunzip duckdb.gz
          chmod +x duckdb
          echo "DUCKDB_BIN=$PWD/duckdb" >> "$GITHUB_ENV"

      - name: Archive
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          COLD_ARCHIVE_DB_URL: ${{ secrets.COLD_ARCHIVE_DB_URL }}
          TRIAL_TABLE: ${{ inputs.trial_table }}
          TRIAL_DAY: ${{ inputs.trial_day }}
        run: |
          if [ -n "$TRIAL_TABLE" ]; then
            bun run archive:cold -- --trial "$TRIAL_TABLE" "$TRIAL_DAY"
          else
            bun run archive:cold
          fi

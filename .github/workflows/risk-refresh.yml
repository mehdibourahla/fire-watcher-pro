name: Daily FWI refresh

# The pipeline is CPU-bound over 1536 communes and exceeds the Cloudflare Worker
# CPU limit, so it runs here instead of the /api/public/cron/risk endpoint.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

# the job only talks to Supabase and Open-Meteo, so it needs no GitHub API access
permissions: {}

concurrency:
  group: risk-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      - name: Refresh risk forecasts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          out=$(bun -e 'const {runRiskPipeline}=await import("./src/lib/ingest/pipeline.server.ts");console.log(JSON.stringify(await runRiskPipeline()))' | tail -1)
          echo "$out"
          err=$(echo "$out" | grep -oE '"error":"[^"]*"' || true)
          rows=$(echo "$out" | grep -oE '"rows":[0-9]+' | grep -oE '[0-9]+' || echo 0)
          if [ -n "$err" ]; then
            # the free quota stops a run partway; that is only a failure if nothing landed
            if [ "$rows" -gt 0 ] && echo "$err" | grep -q 429; then
              echo "::warning::partial refresh — Open-Meteo quota reached after $rows rows"
            else
              echo "::error::$err"
              exit 1
            fi
          fi

name: Daily source jobs

on:
  schedule:
    - cron: "5 6 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  consume:
    strategy:
      fail-fast: false
      matrix:
        contract: [local_fwi, effis]
    concurrency:
      group: daily-source-${{ matrix.contract }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      - name: Consume ${{ matrix.contract }} job
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          deadline=$((SECONDS + 1740))
          while true; do
            set +e
            bun run source:job -- --target github --contract "${{ matrix.contract }}"
            status=$?
            set -e
            if [ "$status" -eq 0 ]; then exit 0; fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::source job drain window exceeded"
              exit 1
            fi
            if [ "$status" -eq 76 ]; then continue; fi
            if [ "$status" -ne 75 ]; then exit "$status"; fi
            sleep 60
          done

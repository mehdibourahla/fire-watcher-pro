name: CI

on:
  pull_request:
  push:
    branches: [main]

# nothing here writes to the repo
permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit
      - run: bun run test
      - run: bun run lint

  db-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.116.0

      # applies every migration to a fresh Postgres, then runs supabase/tests/*.sql
      - run: supabase start -x studio,imgproxy,inbucket,mailpit,logflare,vector,realtime,edge-runtime,supavisor
      - run: supabase test db

  deploy:
    # Deploys are gated by the "production" environment: its secrets and any
    # required reviewers live there, so deploy rights are a GitHub permission.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, db-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://nadhir.app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      # Schema before code: new code must never meet the old schema. The window
      # where old code meets new schema requires additive migrations (CONTRIBUTING).
      - run: bunx supabase@2.116.0 link --project-ref kuukthyenirwgdfkltlm
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      - run: bunx supabase@2.116.0 db push -p "$SUPABASE_DB_PASSWORD"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      # VITE_* values bake into the client at build time and CI has no .env.local;
      # the example ships the real public values, so it IS the build config here.
      - run: cp .env.example .env.local
      - run: bun run build
      # A client built without Supabase config throws on every navigation.
      - run: grep -q "kuukthyenirwgdfkltlm" .output/public/assets/client-*.js
      - run: bunx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

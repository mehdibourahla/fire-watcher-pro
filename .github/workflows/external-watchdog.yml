name: External watchdog

# The in-Worker watchdog cannot report the Worker being dead. This one queries
# Supabase directly and never touches the Worker, so a silent Worker is visible.
on:
  schedule:
    - cron: "13,43 * * * *"
  workflow_dispatch: {}

permissions: {}

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      - name: Report source health from outside the Worker
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          NADHIR_OPERATOR_CHAT_ID: ${{ secrets.NADHIR_OPERATOR_CHAT_ID }}
        run: bun run watchdog:external

name: Source jobs (github target)

# Triggered by private.dispatch_github_source_jobs() from pg_cron; GitHub's own
# schedule trigger delivered 1 of 12 firings on 2026-09-01 and was removed.
on:
  repository_dispatch:
    types: [source-job]
  workflow_dispatch:
    inputs:
      contract:
        description: Source contract key (local_fwi, effis)
        required: true
        type: string

permissions: {}

jobs:
  consume:
    concurrency:
      group: daily-source-${{ github.event.client_payload.contract || inputs.contract }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CONTRACT: ${{ github.event.client_payload.contract || inputs.contract }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      - name: Consume ${{ github.event.client_payload.contract || inputs.contract }} job
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          deadline=$((SECONDS + 1740))
          while true; do
            set +e
            bun run source:job -- --target github --contract "$CONTRACT"
            status=$?
            set -e
            if [ "$status" -eq 0 ]; then exit 0; fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::source job drain window exceeded"
              exit 1
            fi
            if [ "$status" -eq 76 ]; then continue; fi
            if [ "$status" -ne 75 ]; then exit "$status"; fi
            sleep 60
          done

name: Source jobs (github target)

# Primary trigger: private.dispatch_github_source_jobs() from pg_cron (repository_dispatch).
# The schedule is a best-effort fallback only — GitHub delivered 1 of 12 firings on
# 2026-09-01 — so the queue is drained even while the dispatch PAT is unset.
on:
  repository_dispatch:
    types: [source-job]
  schedule:
    - cron: "5 6-17 * * *"
  workflow_dispatch:
    inputs:
      contract:
        description: Source contract key (local_fwi, effis)
        required: true
        type: string

permissions: {}

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      contracts: ${{ steps.pick.outputs.contracts }}
    steps:
      - id: pick
        env:
          DISPATCHED: ${{ github.event.client_payload.contract }}
          MANUAL: ${{ inputs.contract }}
        run: |
          one="${DISPATCHED:-$MANUAL}"
          if [ -n "$one" ]; then
            echo "contracts=[\"$one\"]" >> "$GITHUB_OUTPUT"
          else
            echo 'contracts=["local_fwi","effis"]' >> "$GITHUB_OUTPUT"
          fi

  consume:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        contract: ${{ fromJSON(needs.plan.outputs.contracts) }}
    concurrency:
      group: daily-source-${{ matrix.contract }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      - name: Consume ${{ matrix.contract }} job
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CONTRACT: ${{ matrix.contract }}
        run: |
          deadline=$((SECONDS + 1740))
          while true; do
            set +e
            bun run source:job -- --target github --contract "$CONTRACT"
            status=$?
            set -e
            if [ "$status" -eq 0 ]; then exit 0; fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::source job drain window exceeded"
              exit 1
            fi
            if [ "$status" -eq 76 ]; then continue; fi
            if [ "$status" -ne 75 ]; then exit "$status"; fi
            sleep 60
          done
